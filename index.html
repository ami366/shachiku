<script>
const key='shachiku_app_v1',defaults=['パソコン操作','事務手続き','電話対応','よくある質問','イレギュラー対応'];let data={cats:[...defaults],notes:[]};let cloudReady=false;let cloud={};let loadingRemote=false;let filter='all',catFilter='',editing=null,current=null;const $=id=>document.getElementById(id),icons=['💻','📋','☎️','💬','⚠️','📁'];function persist(){if(!cloudReady){alert('ログインと同期の準備が完了していません');return false}cloud.save(data).catch(e=>alert('同期できませんでした: '+e.message));return true}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function icon(c){let i=data.cats.indexOf(c);return icons[i]||'📁'}function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('selected',x.dataset.page===id));window.scrollTo(0,0);if(id==='home')renderHome();if(id==='categories')renderCats()}function renderHome(){let q=$('search').value.toLowerCase();$('tiles').innerHTML=data.cats.map(c=>`<button class="tile" data-cat="${escapeHtml(c)}"><span class="ico">${icon(c)}</span><strong>${escapeHtml(c)}</strong><small>(${data.notes.filter(n=>n.cat===c).length})</small></button>`).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{catFilter=catFilter===b.dataset.cat?'':b.dataset.cat;renderHome()});document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));let notes=data.notes.filter(n=>(!catFilter||n.cat===catFilter)&&(filter==='all'||(filter==='favorite'?n.fav:n.pin))&&[n.title,n.cat,n.body,n.steps,n.caution].join(' ').toLowerCase().includes(q)).sort((a,b)=>Number(b.pin)-Number(a.pin)||b.updated-a.updated);$('list').innerHTML=(catFilter?`<div class="mini">📁 ${escapeHtml(catFilter)} <button id="clearCat" class="btn secondary" style="padding:4px 10px">解除</button></div>`:'')+(notes.length?notes.map(n=>`<div class="item" data-id="${n.id}"><span class="icon">${icon(n.cat)}</span><div class="info"><div class="title">${escapeHtml(n.title||'無題のメモ')}</div><small>${escapeHtml(n.cat)}</small></div><button class="pin ${n.pin?'on':''}" data-pin="${n.id}">♧</button><button class="star ${n.fav?'on':''}" data-fav="${n.id}">${n.fav?'★':'☆'}</button></div>`).join(''):'<div class="empty">🎀 まだメモがありません<br><small>下の「メモ追加」から作成してね</small></div>');if($('clearCat'))$('clearCat').onclick=()=>{catFilter='';renderHome()};document.querySelectorAll('.item').forEach(e=>e.onclick=()=>openDetail(e.dataset.id));document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();let n=find(b.dataset.fav);n.fav=!n.fav;persist();renderHome()});document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=e=>{e.stopPropagation();let n=find(b.dataset.pin);n.pin=!n.pin;persist();renderHome()})}function find(id){return data.notes.find(n=>String(n.id)===String(id))}function catOptions(){ $('category').innerHTML=data.cats.map(c=>`<option>${escapeHtml(c)}</option>`).join('')}function newMemo(n){editing=n?.id??null;$('formTitle').textContent=n?'🎀 メモを編集':'🎀 メモを追加';catOptions();$('title').value=n?.title||'';$('category').value=n?.cat||data.cats[0];$('type').value=n?.type||'free';$('body').value=n?.body||'';$('steps').value=n?.steps||'';$('caution').value=n?.caution||'';$('image').value='';$('preview').src=n?.image||'';$('preview').classList.toggle('hidden',!n?.image);$('preview').dataset.data=n?.image||'';toggleType();page('edit')}function toggleType(){let manual=$('type').value==='manual';$('manualFields').classList.toggle('hidden',!manual);$('bodyLabel').textContent=manual?'概要・説明':'メモ内容'}$('type').onchange=toggleType;$('image').onchange=()=>{let f=$('image').files[0];if(!f)return;if(f.size>700000){alert('画像は700KB以下にしてください（Firestoreの保存制限のため）');$('image').value='';return}let r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').dataset.data=r.result;$('preview').classList.remove('hidden')};r.readAsDataURL(f)};$('save').onclick=()=>{let n=editing!==null?find(editing):null;let obj={id:n?.id||Date.now().toString()+Math.random().toString(36).slice(2),title:$('title').value.trim(),cat:$('category').value,type:$('type').value,body:$('body').value,steps:$('steps').value,caution:$('caution').value,image:$('preview').dataset.data||'',fav:n?.fav||false,pin:n?.pin||false,checked:n?.checked||[],updated:Date.now()};if(n)Object.assign(n,obj);else data.notes.push(obj);if(persist())page('home')};$('cancel').onclick=()=>page('home');function openDetail(id){current=id;let n=find(id);if(!n)return;let steps=n.steps?.split('\n').filter(s=>s.trim())||[];$('detailBody').innerHTML=`<div class="card"><div class="mini">${icon(n.cat)} ${escapeHtml(n.cat)} · ${n.type==='manual'?'手順マニュアル':'自由メモ'}</div><h2>${escapeHtml(n.title||'無題のメモ')}</h2><div class="detailtext">${escapeHtml(n.body)}</div>${steps.length?'<h3>📋 対応手順</h3>'+steps.map((s,i)=>`<label class="checkline ${(n.checked||[]).includes(i)?'done':''}"><input type="checkbox" data-step="${i}" ${(n.checked||[]).includes(i)?'checked':''}><span>${i+1}. ${escapeHtml(s)}</span></label>`).join(''):''}${n.caution?`<h3>⚠️ 注意点・補足</h3><div class="detailtext">${escapeHtml(n.caution)}</div>`:''}${n.image?`<img class="photo" src="${n.image}">`:''}<div class="row" style="margin-top:20px"><button class="btn" id="editThis">✎ 編集</button><button class="btn secondary" id="copyThis">📋 コピー</button><button class="btn secondary" id="deleteThis">削除</button></div></div>`;page('detail');document.querySelectorAll('[data-step]').forEach(c=>c.onchange=()=>{n.checked=Array.from(document.querySelectorAll('[data-step]:checked')).map(e=>+e.dataset.step);persist();c.parentElement.classList.toggle('done',c.checked)});$('editThis').onclick=()=>newMemo(n);$('copyThis').onclick=async()=>{let t=[n.title,n.body,steps.map((s,i)=>`${i+1}. ${s}`).join('\n'),n.caution].filter(Boolean).join('\n\n');try{await navigator.clipboard.writeText(t);alert('コピーしました')}catch(e){alert('この環境ではコピーできません')}};$('deleteThis').onclick=()=>{if(confirm('このメモを削除しますか？')){data.notes=data.notes.filter(x=>x.id!==n.id);persist();page('home')}}}function renderCats(){$('catList').innerHTML=data.cats.map((c,i)=>`<div class="catrow"><span>${icon(c)} ${escapeHtml(c)} <small>(${data.notes.filter(n=>n.cat===c).length})</small></span><div><button class="btn secondary" data-rename="${i}" style="padding:6px 10px">編集</button> <button class="btn secondary" data-remove="${i}" style="padding:6px 10px">削除</button></div></div>`).join('');document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{let old=data.cats[+b.dataset.rename],name=prompt('カテゴリ名を変更',old)?.trim();if(!name||name===old)return;if(data.cats.includes(name))return alert('同じ名前があります');data.cats[+b.dataset.rename]=name;data.notes.forEach(n=>{if(n.cat===old)n.cat=name});persist();renderCats()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let c=data.cats[+b.dataset.remove];if(data.cats.length===1)return alert('カテゴリは1つ以上必要です');if(!confirm(`「${c}」を削除しますか？ メモは別カテゴリへ移動します。`))return;data.cats.splice(+b.dataset.remove,1);data.notes.forEach(n=>{if(n.cat===c)n.cat=data.cats[0]});persist();renderCats()})}$('addCat').onclick=()=>{let c=$('newCat').value.trim();if(!c||data.cats.includes(c))return;data.cats.push(c);$('newCat').value='';persist();renderCats()};$('search').oninput=renderHome;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderHome()});document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>{if(b.dataset.page==='edit')newMemo();else{page(b.dataset.page);if(b.dataset.search)$('search').focus()}});$('back').onclick=()=>page('home');$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='社畜_バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async()=>{let f=$('import').files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.cats)||!Array.isArray(d.notes))throw Error();if(confirm('現在のデータをバックアップ内容で置き換えますか？')){data=d;cloud.replaceAll(d).then(()=>page('home')).catch(e=>alert(e.message))}}catch(e){alert('正しいバックアップファイルではありません')}finally{$('import').value=''}};renderHome();window.shachiku={setCloud:(adapter)=>{cloud=adapter;cloudReady=true},setData:(d)=>{if(d&&Array.isArray(d.notes)&&Array.isArray(d.cats)){data=d;renderHome();if(document.getElementById('categories').classList.contains('active'))renderCats()}},setAccount:(email)=>{$('accountInfo').textContent='ログイン中: '+email},showAuth:(show)=>{$('authGate').style.display=show?'flex':'none'},setStatus:(msg)=>{$('authStatus').textContent=msg}};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let uid=null,unsubs=[],remoteNotes=new Map(),remoteCats=null,initialized=0,oldIds=new Set(),busy=false;

function subscribe(user){unsubs.forEach(f=>f());unsubs=[];uid=user.uid;remoteNotes=new Map();remoteCats=null;initialized=0;oldIds=new Set();api.setAccount(user.email);api.setCloud({save:async d=>{const batch=writeBatch(db);const ids=new Set(d.notes.map(n=>String(n.id)));for(const n of d.notes)batch.set(doc(db,'users',uid,'notes',String(n.id)),n);for(const id of oldIds)if(!ids.has(id))batch.delete(doc(db,'users',uid,'notes',id));batch.set(doc(db,'users',uid,'settings','preferences'),{cats:d.cats});await batch.commit();oldIds=ids},replaceAll:async d=>{const batch=writeBatch(db);const ids=new Set(d.notes.map(n=>String(n.id)));for(const n of d.notes)batch.set(doc(db,'users',uid,'notes',String(n.id)),n);for(const id of oldIds)if(!ids.has(id))batch.delete(doc(db,'users',uid,'notes',id));batch.set(doc(db,'users',uid,'settings','preferences'),{cats:d.cats});await batch.commit();oldIds=ids}});
